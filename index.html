<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WAA Global Art Explorer - 3D Globe</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; background: #061519; color: #f4f7f4; font-family: Arial, sans-serif; overflow-x: hidden; }
.stage { width: 100vw; height: 450px; position: relative; background: radial-gradient(ellipse at 50% 42%, #164247, #071c21 58%, #041014); }
#globeViz { position: absolute; inset: 0; }
#loading { position: absolute; top: 40%; width: 100%; text-align: center; color: #b9d2ce; font-size: 14px; z-index: 10; font-family: Georgia, serif; }
.hint { position: absolute; bottom: 10px; left: 0; width: 100%; text-align: center; color: #a8c3c0; font-size: 11px; pointer-events: none; z-index: 10; }

/* Embedded Panel Inside Globe Page */
.panel { display: none; max-width: 900px; margin: 20px auto; padding: 0 15px; }
.panel.show { display: block; }
.inner { background: #071c20; border: 1px solid #376766; border-radius: 18px; padding: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
.head { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
h2 { font: 400 26px Georgia,serif; margin: 5px 0; color: #fff; }
p { color: #c1d0ce; font-size: 13px; line-height: 1.6; }
.close { background: transparent; border: 1px solid #527674; color: white; border-radius: 50%; width: 32px; height: 32px; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.links { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; margin-top: 15px; }
.links a { color: #edf5f2; text-decoration: none; background: #10373b; border: 1px solid #2d5b5b; border-radius: 10px; padding: 11px; font-size: 12px; display: block; transition: background 0.2s; }
.links a:hover { background: #1d7979; }
</style>
</head>
<body>

<div class="stage">
  <div id="loading">Loading Worldwide Art Advocacy 3D Globe…</div>
  <div id="globeViz"></div>
  <div class="hint">DRAG TO ROTATE · SCROLL TO ZOOM · CLICK ANY REGION</div>
</div>

<!-- Regional Gateway Panel -->
<div class="panel" id="panel">
  <div class="inner">
    <div class="head">
      <div>
        <div style="color:#9ccbc4;text-transform:uppercase;letter-spacing:2px;font-size:10px;font-weight:bold;">Regional art gateway</div>
        <h2 id="title">Explore a region</h2>
      </div>
      <button class="close" id="close">×</button>
    </div>
    <p id="desc"></p>
    <div class="links" id="links"></div>
  </div>
</div>

<script src="https://unpkg.com/three"></script>
<script src="https://unpkg.com/globe.gl"></script>

<script>
(() => {
  const regions = {
    "Africa": [1, 20, "Discover African artists, visual traditions, cultural knowledge, and contemporary creative industries across the continent."],
    "Europe": [52, 15, "Explore Europe's art histories, major institutions, creative communities, and contemporary cross-border opportunities."],
    "Asia": [28, 90, "Explore diverse artistic traditions, contemporary practices, and rapidly expanding cultural industries across Asia."],
    "North America": [40, -100, "Discover independent artists, institutions, commercial enterprises, and career opportunities across North America."],
    "Latin America & Caribbean": [-15, -60, "Explore vibrant regional art scenes, indigenous cultural heritage, and Latin American biennale networks."],
    "Oceania": [-23, 145, "Discover Indigenous visual art legacies, Pacific creative networks, museums, and contemporary artist collectives."]
  };

  const categories = [
    "Artists & Creative Professionals",
    "Galleries, Museums & Art Spaces",
    "Traditional & Contemporary Art",
    "Art Education & Learning",
    "Exhibitions, Festivals & Biennales",
    "Residencies, Grants & Open Calls",
    "Art Markets & Collectors",
    "Art Services & Professional Support"
  ];

  let globe;

  window.openRegionModal = function(name) {
    const descText = regions[name] ? regions[name][2] : "";
    if (!descText) return;

    document.getElementById("title").textContent = name;
    document.getElementById("desc").textContent = descText;

    const linksContainer = document.getElementById("links");
    linksContainer.innerHTML = "";

    categories.forEach(cat => {
      const a = document.createElement("a");
      a.href = "https://worldwideartadvocacy.wordpress.com/global-art-hub/";
      a.textContent = cat + " →";
      a.target = "_parent"; // Opens in the main site window
      linksContainer.appendChild(a);
    });

    document.getElementById("panel").classList.add("show");
    if (globe && regions[name]) {
      globe.pointOfView({ lat: regions[name][0], lng: regions[name][1], altitude: 1.5 }, 1000);
    }
  };

  document.getElementById("close").onclick = () => {
    document.getElementById("panel").classList.remove("show");
  };

  try {
    const globeData = Object.keys(regions).map(key => ({
      name: key,
      lat: regions[key][0],
      lng: regions[key][1]
    }));

    globe = Globe()(document.getElementById("globeViz"))
      .globeImageUrl("https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg")
      .bumpImageUrl("https://unpkg.com/three-globe/example/img/earth-topology.png")
      .backgroundColor("rgba(0,0,0,0)")
      .showAtmosphere(true)
      .atmosphereColor("#58bdb5")
      .atmosphereAltitude(0.18)
      .htmlElementsData(globeData)
      .htmlLat(d => d.lat)
      .htmlLng(d => d.lng)
      .htmlElement(d => {
        const el = document.createElement('button');
        el.innerHTML = `<div style="background:#1d7979;border:2px solid #e5f0ed;color:#fff;padding:6px 12px;border-radius:14px;font-size:11px;font-weight:bold;cursor:pointer;box-shadow:0 0 15px rgba(29,121,121,0.9);white-space:nowrap;font-family:Arial,sans-serif;">${d.name}</div>`;
        el.style.transform = 'translate(-50%, -50px)';
        el.style.border = 'none';
        el.style.background = 'transparent';
        el.style.padding = '0';
        
        el.onclick = (e) => {
          e.stopPropagation();
          window.openRegionModal(d.name);
        };
        return el;
      });

    const controls = globe.controls();
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.35;
    controls.enableZoom = true;

    globe.pointOfView({ lat: 18, lng: 5, altitude: 2.25 });
    document.getElementById("loading").style.display = "none";

    window.addEventListener("resize", () => {
      globe.width(window.innerWidth);
      globe.height(450);
    });
  } catch (err) {
    document.getElementById("loading").textContent = "Globe initialization failed.";
  }
})();
</script>
</body>
</html>
